<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUMA SKIN | Skin, Reimagined</title>
    <meta name="description" content="Science-powered hydration engineered for luminous skin.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Inter:wght@300;400;500&family=Manrope:wght@300;500&family=Galada&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        :root {
            --bg-color: #fdfcf0;
            --text-color: #1a1a1a;
            --accent-color: #d4af37; /* Champagne */
            --muted-color: rgba(26, 26, 26, 0.6);
            --glass-bg: rgba(255, 255, 255, 0.4);
            --glass-border: rgba(0, 0, 0, 0.05);
            --font-main: 'Inter', sans-serif;
            --font-heading: 'Galada', cursive;
            --font-editorial: 'Outfit', sans-serif;

            /* Dynamic Background - Luxury High Key */
            --bg-inner: #ffffff;
            --bg-mid: #f7f3ed;
            --bg-outer: #efebdf;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at center, var(--bg-inner) 0%, var(--bg-mid) 50%, var(--bg-outer) 100%);
            color: var(--text-color);
            font-family: var(--font-main);
            overflow: hidden;
            height: 100vh;
            transition: background 1.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Bubble/Orb styling */
        #bubbles-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0; overflow: hidden;
        }

        .bubble-img {
            position: absolute;
            pointer-events: none;
            filter: blur(2px) brightness(1.2);
        }

        @keyframes floatUpImg {
            0% { transform: translateY(0) translateX(0) scale(0.5); opacity: 0; }
            20% { opacity: 0.3; }
            80% { opacity: 0.3; }
            100% { transform: translateY(-110vh) translateX(50px) scale(1.5); opacity: 0; }
        }

        /* Header - Editorial Glass */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 5%;
            position: fixed;
            top: 0; width: 100%; z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-weight: 400;
            font-size: 1.4rem;
            font-family: var(--font-editorial);
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        .nav {
            display: flex;
            gap: 0.5rem;
            background: rgba(255, 255, 255, 0.2);
            padding: 0.4rem;
            border-radius: 100px;
            border: 1px solid rgba(0, 0, 0, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
        }

        .nav-item {
            font-family: 'Manrope', sans-serif;
            color: var(--muted-color);
            text-decoration: none;
            font-size: 0.75rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            padding: 0.6rem 1.4rem;
            border-radius: 100px;
            transition: all 0.4s ease;
        }

        .nav-item:hover, .nav-item.active {
            background: var(--text-color);
            color: #fff;
        }

        .contact-btn {
            background: transparent;
            color: var(--text-color);
            border: 1px solid var(--text-color);
            padding: 0.7rem 1.8rem;
            border-radius: 100px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .contact-btn:hover {
            background: var(--text-color);
            color: #fff;
        }

        /* Hero Layout */
        .hero {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 5%;
        }

        .hero-content {
            display: flex;
            justify-content: space-between;
            align-items: stretch;
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* Editorial Typography */
        .main-title, .side-title {
            font-family: var(--font-heading);
            font-size: clamp(4rem, 8vw, 10rem);
            line-height: 0.9;
            color: var(--text-color);
        }

        .outline {
            color: transparent;
            -webkit-text-stroke: 1px var(--text-color);
            font-family: var(--font-editorial);
            text-transform: uppercase;
            font-weight: 300;
            font-size: 0.8em;
            letter-spacing: 0.05em;
        }

        /* Floating Elements */
        .leaves-container, .berries-container, .berries-container-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
        }

        .leaf { filter: drop-shadow(0 5px 15px rgba(0,0,0,0.05)) grayscale(0.2) opacity(0.6); }
        .berry { filter: drop-shadow(0 10px 20px rgba(0,0,0,0.05)); }

        /* Left Column */
        .hero-left {
            display: flex;
            flex-direction: column;
            height: 100%;
            padding: 8rem 0;
            gap: 2.5rem;
            z-index: 10;
        }

        .description {
            color: var(--muted-color);
            font-size: 1.1rem;
            line-height: 1.8;
            max-width: 380px;
            font-weight: 300;
            font-family: var(--font-editorial);
        }

        .primary-btn {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            background: var(--text-color);
            color: #fff;
            border: none;
            padding: 0.5rem 0.5rem 0.5rem 2rem;
            border-radius: 100px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-size: 0.8rem;
            cursor: pointer;
            width: fit-content;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        .primary-btn:hover { transform: scale(1.05); }

        .plus-icon {
            background: #fff;
            color: var(--text-color);
            width: 38px; height: 38px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%;
        }

        /* Center Product */
        .hero-center {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            z-index: 5; pointer-events: none;
        }

        .main-product-3d {
            width: 75vw; height: 75vh;
            transform: translate(-50%, -50%) rotate(-5deg);
            position: fixed; top: 50%; left: 50%;
            pointer-events: auto;
            --poster-color: transparent;
        }

        /* Right Column - Product Swatches */
        .hero-right {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: flex-end;
            text-align: right;
            height: 100%;
            padding: 8rem 0; width: 400px; z-index: 10;
        }

        .card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            padding: 1.5rem; padding-top: 6rem;
            border-radius: 20px;
            width: 130px;
            cursor: pointer;
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            backdrop-filter: blur(10px);
        }

        .card:hover { transform: translateY(-10px); background: #fff; border-color: var(--accent-color); }
        .card.active { border-color: var(--accent-color); background: #fff; }

        .card img {
            width: 140px; margin-top: -10rem;
            filter: drop-shadow(0 15px 25px rgba(0,0,0,0.15));
            transition: transform 0.6s ease;
        }

        .card-info {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 600;
            margin-top: 1rem;
            text-align: center;
        }

        .award-badge {
            display: flex; align-items: center; gap: 1rem; margin-top: auto;
        }
        .award-text { display: flex; flex-direction: column; text-align: left; }
        .award-title { font-size: 0.6rem; letter-spacing: 0.15em; font-weight: 700; }
        .award-subtitle { font-size: 0.75rem; font-weight: 300; font-family: var(--font-editorial); }

        @media (max-width: 1200px) {
            .main-product-3d { width: 90vw; height: 60vh; }
            .hero-content { flex-direction: column; align-items: center; text-align: center; }
            .hero-right, .hero-left { width: 100%; align-items: center; text-align: center; }
            .main-title { font-size: 4rem; }
        }
    </style>
</head>
<body>

    <div id="bubbles-container"></div>

    <header class="header">
        <div class="logo">
            <span>Luma Skin</span>
        </div>
        <nav class="nav glass">
            <a href="#" class="nav-item active">Products</a>
            <a href="#" class="nav-item">Science</a>
            <a href="#" class="nav-item">Ingredients</a>
            <a href="#" class="nav-item">Results</a>
            <a href="#" class="nav-item">Reviews</a>
        </nav>
        <button class="contact-btn">Contact</button>
    </header>

    <main class="hero">
        <div class="hero-content">
            <!-- Floating Botanical Stems -->
            <div class="leaves-container">
                <model-viewer class="leaf l1" src="https://api.getlayers.ai/storage/v1/object/public/public/assets/soda-14ff8a788d/leaves.glb" exposure="1.0" interaction-prompt="none" camera-orbit="45deg 75deg 105%"></model-viewer>
                <model-viewer class="leaf l2" src="https://api.getlayers.ai/storage/v1/object/public/public/assets/soda-14ff8a788d/leaves.glb" exposure="1.0" interaction-prompt="none" camera-orbit="-30deg 60deg 105%"></model-viewer>
                <model-viewer class="leaf l3" src="https://api.getlayers.ai/storage/v1/object/public/public/assets/soda-14ff8a788d/leaves.glb" exposure="1.0" interaction-prompt="none" camera-orbit="120deg 85deg 105%"></model-viewer>
            </div>

            <div class="hero-left">
                <h1 class="main-title">
                    <span class="outline">Skin,</span><br>Reimagined
                </h1>
                <p class="description" id="hero-desc">
                    Science-powered hydration engineered for luminous skin. Experience clinical grade serums in elegant textures.
                </p>
                <button class="primary-btn">
                    Discover Collection <span class="plus-icon">+</span>
                </button>

                <div class="award-badge">
                    <div class="award-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <circle cx="12" cy="12" r="10" stroke-width="1"/>
                            <path d="M8 12l3 3 5-5" stroke-width="1.5" stroke-linecap="round"/>
                        </svg>
                    </div>
                    <div class="award-text">
                        <span class="award-title">VOGUE BEAUTY</span>
                        <span class="award-subtitle">EDITORS CHOICE 2025</span>
                    </div>
                </div>
            </div>

            <div class="hero-center">
                <model-viewer id="product-model" 
                    src="https://api.getlayers.ai/storage/v1/object/public/public/assets/soda-14ff8a788d/deit_soda2.glb"
                    camera-controls disable-zoom shadow-intensity="0" 
                    environment-image="neutral" exposure="1.2" 
                    interaction-prompt="none" camera-orbit="0deg 90deg 380%" 
                    field-of-view="30deg" class="main-product-3d">
                </model-viewer>
            </div>

            <!-- Floating Capsules (using cherry/blueberry model foundations) -->
            <div class="berries-container">
                <model-viewer class="berry b1" src="https://api.getlayers.ai/storage/v1/object/public/public/assets/soda-14ff8a788d/cherry.glb" exposure="0.8"></model-viewer>
                <model-viewer class="berry b2" src="https://api.getlayers.ai/storage/v1/object/public/public/assets/soda-14ff8a788d/cherry.glb" exposure="0.8"></model-viewer>
                <model-viewer class="berry b3" src="https://api.getlayers.ai/storage/v1/object/public/public/assets/soda-14ff8a788d/cherry.glb" exposure="0.8"></model-viewer>
                <model-viewer class="berry b4" src="https://api.getlayers.ai/storage/v1/object/public/public/assets/soda-14ff8a788d/blueberry.glb" exposure="0.8"></model-viewer>
            </div>

            <div class="hero-right">
                <div class="product-carousel">
                    <div class="carousel-cards">
                        <div class="card active" data-product="hydration" data-color-top="#f0f9ff" data-color-mid="#e0f2fe" data-color-bot="#bae6fd">
                            <img src="https://api.getlayers.ai/storage/v1/object/public/public/assets/soda-14ff8a788d/Blue%20Soda.png" alt="Hydration Serum">
                            <div class="card-info">Hydration Serum</div>
                        </div>
                        <div class="card" data-product="vitaminc" data-color-top="#fffaf0" data-color-mid="#fef3c7" data-color-bot="#fde68a">
                            <img src="https://api.getlayers.ai/storage/v1/object/public/public/assets/soda-14ff8a788d/Green%20Soda.png" alt="Vitamin C Burst">
                            <div class="card-info">Vitamin C Burst</div>
                        </div>
                    </div>
                </div>
                <h2 class="side-title"><span class="outline">Science</span><br>Backed</h2>
            </div>
        </div>
    </main>

    <script>
        const modelViewer = document.querySelector('#product-model');
        const berriesContainer = document.querySelector('.berries-container');
        const leavesContainer = document.querySelector('.leaves-container');
        const cards = document.querySelectorAll('.card');
        const allFloating = document.querySelectorAll('.berry, .leaf');
        const descText = document.querySelector('#hero-desc');

        let isSwitching = false;
        let switchSpin = 0;
        let blueTexture, greenTexture;

        // Preload labels for the "bottles"
        modelViewer.addEventListener('load', async () => {
            blueTexture = await modelViewer.createTexture('https://api.getlayers.ai/storage/v1/object/public/public/assets/soda-14ff8a788d/blue%20base%20color.jpg');
            greenTexture = await modelViewer.createTexture('https://api.getlayers.ai/storage/v1/object/public/public/assets/soda-14ff8a788d/green%20base%20color.jpg');
            // Start as Hydration
            modelViewer.model.materials[0].pbrMetallicRoughness.baseColorTexture.setTexture(blueTexture);
        });

        cards.forEach(card => {
            card.addEventListener('click', () => {
                if (isSwitching || card.classList.contains('active')) return;
                cards.forEach(c => c.classList.remove('active'));
                card.classList.add('active');
                switchProduct(card.dataset.product, card.dataset);
            });
        });

        function switchProduct(id, colors) {
            isSwitching = true;
            
            // 1. Background Morph
            gsap.to(document.body, {
                '--bg-inner': colors.colorTop,
                '--bg-mid': colors.colorMid,
                '--bg-outer': colors.colorBot,
                duration: 1.5,
                ease: 'power2.inOut'
            });

            // 2. Cinematic Spin & Texture Swap
            const spinObj = { val: 0, blur: 0 };
            gsap.to(spinObj, {
                val: 360, blur: 10, duration: 0.8, ease: 'power2.in',
                onUpdate: () => {
                    switchSpin = spinObj.val;
                    modelViewer.style.filter = `blur(${spinObj.blur}px)`;
                },
                onComplete: () => {
                    const material = modelViewer.model.materials[0];
                    material.pbrMetallicRoughness.baseColorTexture.setTexture(id === 'hydration' ? blueTexture : greenTexture);
                    
                    // Update text
                    descText.innerText = id === 'hydration' 
                        ? 'Science-powered hydration engineered for luminous skin. Experience clinical grade serums.' 
                        : 'Advanced antioxidant formula to brighten and protect against daily stressors.';

                    gsap.to(spinObj, {
                        val: 720, blur: 0, duration: 1.2, ease: 'back.out(0.7)',
                        onUpdate: () => {
                            switchSpin = spinObj.val;
                            modelViewer.style.filter = `blur(${spinObj.blur}px)`;
                        },
                        onComplete: () => {
                            switchSpin = 0;
                            modelViewer.style.filter = 'none';
                            isSwitching = false;
                        }
                    });
                }
            });

            // 3. Floating Implode/Explode System
            allFloating.forEach(obj => {
                const rect = obj.getBoundingClientRect();
                const cX = (window.innerWidth / 2 - rect.left - rect.width / 2);
                const cY = (window.innerHeight / 2 - rect.top - rect.height / 2);

                gsap.timeline()
                    .to(obj, { x: cX, y: cY, scale: 0.2, opacity: 0, duration: 0.6, ease: 'power2.in' })
                    .to(obj, { x: (Math.random() - 0.5) * 400, y: (Math.random() - 0.5) * 400, scale: 1, opacity: 0.6, duration: 1, delay: 0.2, ease: 'back.out(1.2)' });
            });
        }

        // Init Floating States
        allFloating.forEach(b => {
            b.dataset.rx = 0; b.dataset.ry = 0; b.dataset.angle = Math.random() * 360;
            b.dataset.baseX = 0; b.dataset.baseY = 0;
        });

        // Parallax Logic
        let mouse = { x: 0, y: 0, px: 0, py: 0 }, currentMouse = { x: 0, y: 0 };
        window.addEventListener('mousemove', e => {
            mouse.x = (e.clientX / window.innerWidth) - 0.5;
            mouse.y = (e.clientY / window.innerHeight) - 0.5;
            mouse.px = e.clientX; mouse.py = e.clientY;
        });

        function animate() {
            const time = Date.now() * 0.001;
            currentMouse.x += (mouse.x - currentMouse.x) * 0.05;
            currentMouse.y += (mouse.y - currentMouse.y) * 0.05;

            modelViewer.cameraOrbit = `${(currentMouse.x * 30) + switchSpin}deg ${90 + (currentMouse.y * 15)}deg 380%`;

            // Smooth Parallax Containers
            berriesContainer.style.transform = `translate(${currentMouse.x * 40}px, ${currentMouse.y * 40}px)`;
            leavesContainer.style.transform = `translate(${currentMouse.x * -20}px, ${currentMouse.y * -20}px)`;

            if (!isSwitching) {
                allFloating.forEach((obj, i) => {
                    const rect = obj.getBoundingClientRect();
                    const bX = rect.left + rect.width / 2, bY = rect.top + rect.height / 2;
                    const dX = mouse.px - bX, dY = mouse.py - bY, dist = Math.sqrt(dX * dX + dY * dY);
                    
                    let tRx = 0, tRy = 0;
                    if (dist < 400) {
                        const f = (400 - dist) / 400;
                        tRx = (dX / dist) * f * -60; tRy = (dY / dist) * f * -60;
                    }

                    let rx = parseFloat(obj.dataset.rx), ry = parseFloat(obj.dataset.ry), a = parseFloat(obj.dataset.angle);
                    rx += (tRx - rx) * 0.1; ry += (tRy - ry) * 0.1; a += 0.1;
                    obj.dataset.rx = rx; obj.dataset.ry = ry; obj.dataset.angle = a;

                    const ph = (time + i * 1.5) * (Math.PI * 2 / 10);
                    obj.style.transform = `translate(${rx}px, ${ry + Math.sin(ph) * 10}px) rotate(${a}deg)`;
                });
            }
            requestAnimationFrame(animate);
        }
        animate();

        // Light Orb Generator (Replaced soda bubbles)
        setInterval(() => {
            const orb = document.createElement('img');
            orb.src = 'https://api.getlayers.ai/storage/v1/object/public/public/assets/soda-14ff8a788d/bubble.png';
            orb.className = 'bubble-img';
            const size = Math.random() * 15 + 5 + 'px';
            orb.style.width = size; orb.style.left = Math.random() * 100 + '%';
            orb.style.bottom = '-50px'; orb.style.opacity = '0.2';
            const dur = Math.random() * 8 + 6;
            orb.style.animation = `floatUpImg ${dur}s ease-in forwards`;
            document.getElementById('bubbles-container').appendChild(orb);
            setTimeout(() => orb.remove(), dur * 1000);
        }, 600);
    </script>
</body>
</html>

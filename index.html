<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaintPro Stellar | Professional Painting Services</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            primary: "#0F172A",
                            accent: "#F97316",
                            muted: "#64748B",
                            bg: "#F8FAFC"
                        }
                    },
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                }
            }
        }
    </script>

    <style>
        html { scroll-behavior: smooth; }
        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); }
        .hero-gradient { background: radial-gradient(circle at top right, rgba(249, 115, 22, 0.05), transparent); }
        .reveal { opacity: 0; transform: translateY(20px); transition: all 0.8s ease-out; }
        .reveal.active { opacity: 1; transform: translateY(0); }
    </style>
</head>
<body class="bg-white text-brand-primary antialiased">

    <div id="root"></div>

    <!-- Load React, ReactDOM, and Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- Helper: Icon Component ---
        const Icon = ({ name, className = "" }) => {
            useEffect(() => {
                lucide.createIcons();
            }, []);
            return <i data-lucide={name} className={className}></i>;
        };

        // --- Navbar Component ---
        const Navbar = () => {
            const [scrolled, setScrolled] = useState(false);
            const [mobileOpen, setMobileOpen] = useState(false);

            useEffect(() => {
                const handleScroll = () => setScrolled(window.scrollY > 20);
                window.addEventListener("scroll", handleScroll);
                return () => window.removeEventListener("scroll", handleScroll);
            }, []);

            return (
                <nav className={`fixed w-full z-50 transition-all duration-300 ${scrolled ? 'py-4 glass border-b border-gray-100 shadow-sm' : 'py-6 bg-transparent'}`}>
                    <div className="max-w-7xl mx-auto px-6 flex justify-between items-center">
                        <div className="flex items-center gap-2 font-extrabold text-2xl tracking-tight">
                            <div className="bg-brand-accent p-1.5 rounded-lg text-white">
                                <Icon name="paintbrush" className="w-6 h-6" />
                            </div>
                            <span>PaintPro</span>
                        </div>
                        
                        <div className="hidden md:flex items-center gap-10">
                            {["Services", "Process", "Portfolio", "Contact"].map(item => (
                                <a key={item} href={`#${item.toLowerCase()}`} className="text-sm font-semibold hover:text-brand-accent transition-colors">
                                    {item}
                                </a>
                            ))}
                            <button className="bg-brand-primary text-white px-7 py-3 rounded-full font-bold text-sm hover:bg-slate-800 transition-all hover:shadow-lg">
                                Get a Quote
                            </button>
                        </div>

                        <button className="md:hidden" onClick={() => setMobileOpen(!mobileOpen)}>
                            <Icon name={mobileOpen ? "x" : "menu"} />
                        </button>
                    </div>

                    {/* Mobile Menu */}
                    {mobileOpen && (
                        <div className="md:hidden bg-white border-t p-6 flex flex-col gap-4 animate-fade-in">
                            {["Services", "Process", "Portfolio", "Contact"].map(item => (
                                <a key={item} href={`#${item.toLowerCase()}`} onClick={() => setMobileOpen(false)} className="text-lg font-bold">{item}</a>
                            ))}
                        </div>
                    )}
                </nav>
            );
        };

        // --- Hero Component ---
        const Hero = () => (
            <section className="relative pt-44 pb-32 overflow-hidden hero-gradient">
                <div className="max-w-7xl mx-auto px-6 flex flex-col lg:flex-row items-center gap-16">
                    <div className="flex-1 text-center lg:text-left">
                        <span className="inline-flex items-center gap-2 py-1.5 px-4 rounded-full bg-orange-50 text-brand-accent text-xs font-extrabold mb-8 tracking-wider uppercase">
                            <span className="relative flex h-2 w-2">
                                <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-brand-accent opacity-75"></span>
                                <span className="relative inline-flex rounded-full h-2 w-2 bg-brand-accent"></span>
                            </span>
                            Premium Painting in Seattle
                        </span>
                        <h1 className="text-5xl md:text-7xl font-black text-brand-primary leading-[1.05] mb-8">
                            Spaces that <span className="text-brand-accent">inspire</span> every day.
                        </h1>
                        <p className="text-xl text-brand-muted mb-10 max-w-xl mx-auto lg:mx-0 leading-relaxed">
                            Meticulous interior and exterior painting services designed to transform your environment with precision.
                        </p>
                        <div className="flex flex-col sm:flex-row gap-4 justify-center lg:justify-start">
                            <button className="bg-brand-accent text-white px-10 py-5 rounded-2xl text-lg font-bold shadow-xl shadow-orange-200 hover:-translate-y-1 transition-all">
                                Book Estimate
                            </button>
                            <button className="bg-white border-2 border-gray-100 px-10 py-5 rounded-2xl text-lg font-bold hover:bg-gray-50 transition-all flex items-center justify-center gap-2">
                                <Icon name="play" className="w-5 h-5 fill-current" />
                                Our Process
                            </button>
                        </div>
                    </div>
                    
                    <div className="flex-1 relative">
                        <div className="relative z-10 rounded-[2.5rem] overflow-hidden shadow-2xl rotate-2">
                            <img src="https://images.unsplash.com/photo-1589939705384-5185138a04b9?q=80&w=1200" alt="Hero" className="w-full h-full object-cover" />
                        </div>
                        <div className="absolute -bottom-10 -left-10 bg-white p-8 rounded-3xl shadow-2xl z-20 hidden md:block -rotate-2 border border-gray-100">
                            <div className="flex items-center gap-4">
                                <div className="text-4xl font-black text-brand-accent">99%</div>
                                <div className="text-sm font-bold text-brand-muted uppercase leading-tight">Customer<br/>Satisfaction</div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        );

        // --- Services Component ---
        const Services = () => (
            <section id="services" className="py-32 bg-brand-bg">
                <div className="max-w-7xl mx-auto px-6">
                    <div className="flex flex-col md:flex-row justify-between items-end gap-6 mb-20">
                        <div className="max-w-2xl">
                            <h2 className="text-4xl md:text-5xl font-black mb-6">Unrivaled Quality</h2>
                            <p className="text-brand-muted text-lg leading-relaxed">From heritage restorations to modern industrial spaces, we apply excellence to every surface we touch.</p>
                        </div>
                        <div className="flex gap-4 mb-2">
                            <div className="w-12 h-12 rounded-full border border-gray-200 flex items-center justify-center text-gray-400 hover:text-brand-accent cursor-pointer transition-colors">
                                <Icon name="arrow-left" className="w-5 h-5" />
                            </div>
                            <div className="w-12 h-12 rounded-full bg-brand-primary text-white flex items-center justify-center cursor-pointer hover:bg-slate-800 transition-all">
                                <Icon name="arrow-right" className="w-5 h-5" />
                            </div>
                        </div>
                    </div>
                    
                    <div className="grid md:grid-cols-3 gap-8">
                        {[
                            { t: "Interior Masterclass", d: "Flawless walls, ceilings, and trim work with premium low-VOC paints.", i: "home" },
                            { t: "Exterior Shield", d: "Weather-resistant coatings that protect your home while enhancing curb appeal.", i: "shield" },
                            { t: "Cabinet Refinishing", d: "Factory-grade finishes for kitchen and bathroom cabinetry at a fraction of replacement cost.", i: "layers" }
                        ].map((s, idx) => (
                            <div key={idx} className="bg-white p-10 rounded-[2.5rem] border border-gray-100 hover:shadow-2xl transition-all group cursor-pointer">
                                <div className="w-16 h-16 bg-brand-bg text-brand-accent rounded-2xl flex items-center justify-center mb-8 group-hover:bg-brand-accent group-hover:text-white transition-all duration-500">
                                    <Icon name={s.i} className="w-8 h-8" />
                                </div>
                                <h3 className="text-2xl font-black mb-4 group-hover:text-brand-accent transition-colors">{s.t}</h3>
                                <p className="text-brand-muted leading-relaxed mb-6">{s.d}</p>
                                <div className="flex items-center gap-2 font-bold text-sm text-brand-primary group-hover:gap-4 transition-all">
                                    Learn More <Icon name="chevron-right" className="w-4 h-4" />
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            </section>
        );

        // --- Contact Component ---
        const Contact = () => (
            <section id="contact" className="py-32 bg-white">
                <div className="max-w-7xl mx-auto px-6">
                    <div className="bg-brand-primary rounded-[3.5rem] overflow-hidden flex flex-col lg:flex-row">
                        <div className="lg:w-1/2 p-12 md:p-20 text-white flex flex-col justify-center">
                            <h2 className="text-4xl md:text-6xl font-black mb-8 leading-tight">Ready for a <br/><span className="text-brand-accent">fresh start?</span></h2>
                            <p className="text-slate-400 text-lg mb-12 max-w-md">Schedule your free, no-obligation estimate today. Our experts are ready to assist with your next project.</p>
                            
                            <div className="space-y-8">
                                <div className="flex items-center gap-6">
                                    <div className="w-14 h-14 bg-white/10 rounded-2xl flex items-center justify-center">
                                        <Icon name="phone" className="w-6 h-6 text-brand-accent" />
                                    </div>
                                    <div>
                                        <p className="text-xs font-bold text-slate-500 uppercase tracking-widest">Call us</p>
                                        <p className="text-xl font-bold">(555) 000-1234</p>
                                    </div>
                                </div>
                                <div className="flex items-center gap-6">
                                    <div className="w-14 h-14 bg-white/10 rounded-2xl flex items-center justify-center">
                                        <Icon name="mail" className="w-6 h-6 text-brand-accent" />
                                    </div>
                                    <div>
                                        <p className="text-xs font-bold text-slate-500 uppercase tracking-widest">Email us</p>
                                        <p className="text-xl font-bold">hello@paintpro.com</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <div className="lg:w-1/2 p-4 md:p-8">
                            <div className="bg-white rounded-[2.5rem] p-8 md:p-12 h-full">
                                <form className="space-y-6">
                                    <div className="grid md:grid-cols-2 gap-6">
                                        <div>
                                            <label className="block text-xs font-black uppercase tracking-widest text-brand-muted mb-2 ml-1">Full Name</label>
                                            <input type="text" className="w-full p-5 bg-brand-bg rounded-2xl outline-none focus:ring-2 ring-brand-accent/20 transition-all border border-transparent focus:border-brand-accent/10" placeholder="John Doe" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-black uppercase tracking-widest text-brand-muted mb-2 ml-1">Email</label>
                                            <input type="email" className="w-full p-5 bg-brand-bg rounded-2xl outline-none" placeholder="john@example.com" />
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-black uppercase tracking-widest text-brand-muted mb-2 ml-1">Service</label>
                                        <select className="w-full p-5 bg-brand-bg rounded-2xl outline-none appearance-none">
                                            <option>Interior Painting</option>
                                            <option>Exterior Painting</option>
                                            <option>Commercial Project</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-black uppercase tracking-widest text-brand-muted mb-2 ml-1">Message</label>
                                        <textarea rows="4" className="w-full p-5 bg-brand-bg rounded-2xl outline-none" placeholder="Tell us about your space..."></textarea>
                                    </div>
                                    <button className="w-full bg-brand-accent text-white py-6 rounded-2xl font-black text-lg hover:shadow-2xl hover:shadow-orange-400/30 transition-all hover:-translate-y-1">
                                        Send Request
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        );

        // --- Footer Component ---
        const Footer = () => (
            <footer className="bg-white border-t border-gray-100 py-16">
                <div className="max-w-7xl mx-auto px-6">
                    <div className="flex flex-col md:flex-row justify-between items-center gap-10">
                        <div className="flex items-center gap-2 font-extrabold text-2xl tracking-tight">
                            <div className="bg-brand-primary p-1 rounded-lg text-white">
                                <Icon name="paintbrush" className="w-5 h-5" />
                            </div>
                            <span>PaintPro.</span>
                        </div>
                        <div className="flex gap-10 text-sm font-bold text-brand-muted">
                            <a href="#" className="hover:text-brand-accent transition-colors">Privacy</a>
                            <a href="#" className="hover:text-brand-accent transition-colors">Terms</a>
                            <a href="#" className="hover:text-brand-accent transition-colors">Instagram</a>
                            <a href="#" className="hover:text-brand-accent transition-colors">LinkedIn</a>
                        </div>
                        <p className="text-sm text-brand-muted font-medium">© 2024 PaintPro Stellar. All rights reserved.</p>
                    </div>
                </div>
            </footer>
        );

        // --- Main App ---
        const App = () => {
            useEffect(() => {
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) entry.target.classList.add('active');
                    });
                }, { threshold: 0.1 });

                document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
            }, []);

            return (
                <div>
                    <Navbar />
                    <Hero />
                    <div className="reveal"><Services /></div>
                    <div className="reveal"><Contact /></div>
                    <Footer />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[BUSINESS_NAME] | Premium Painting in [CITY_NAME]</title>
    <meta name="description" content="Professional interior and exterior painting services in [CITY_NAME]. Request your free estimate today.">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: {
                            DEFAULT: '#0F172A',
                            light: '#1E293B'
                        },
                        gold: {
                            DEFAULT: '#F59E0B',
                            hover: '#D97706'
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                }
            }
        }
    </script>

    <!-- React and Babel CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .hero-overlay {
            background: linear-gradient(rgba(15, 23, 42, 0.7), rgba(15, 23, 42, 0.7));
        }
        @keyframes pulse-subtle {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }
        .animate-pulse-subtle {
            animation: pulse-subtle 3s infinite ease-in-out;
        }
        /* Custom Slider Styling */
        .before-after-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            overflow: hidden;
            border-radius: 1rem;
        }
    </style>
</head>
<body class="bg-slate-50 text-navy antialiased">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- COMPONENTS ---

        const Nav = () => (
            <header className="sticky top-0 z-50 w-full bg-white/90 backdrop-blur-md border-b border-slate-200">
                <div className="container mx-auto px-4 h-20 flex items-center justify-between">
                    <div className="text-2xl font-extrabold tracking-tighter text-navy uppercase">
                        [BUSINESS_NAME]
                    </div>
                    
                    {/* Desktop Menu */}
                    <div className="hidden md:flex items-center gap-6">
                        <a href="tel:[PHONE_NUMBER]" className="text-navy font-bold hover:text-blue-700 transition-colors">
                            Call Now: [PHONE_NUMBER]
                        </a>
                        <button className="bg-gold hover:bg-gold-hover text-navy font-bold px-6 py-3 rounded-xl transition-all shadow-lg active:scale-95">
                            Get Free Estimate
                        </button>
                    </div>

                    {/* Mobile Hamburger (Simulated) */}
                    <div className="md:hidden">
                        <button className="p-2" onClick={() => alert('Mobile menu logic would go here.')}>
                            <i data-lucide="menu" className="w-8 h-8"></i>
                        </button>
                    </div>
                </div>
            </header>
        );

        const QuoteCalculator = () => {
            const [step, setStep] = useState(1);
            const [data, setData] = useState({ service: '', urgency: '', name: '', phone: '' });

            return (
                <div className="relative z-20 -mt-24 max-w-4xl mx-auto px-4">
                    <div className="glass-card rounded-2xl shadow-2xl p-6 md:p-10">
                        <div className="flex justify-between mb-8">
                            {[1, 2, 3].map(i => (
                                <div key={i} className={`h-1.5 flex-1 mx-1 rounded-full ${step >= i ? 'bg-gold' : 'bg-slate-200'}`} />
                            ))}
                        </div>

                        {step === 1 && (
                            <div>
                                <h3 className="text-2xl font-bold mb-6 text-center">What do you need painted?</h3>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    {['Interior', 'Exterior', 'Cabinets', 'Commercial'].map(type => (
                                        <button 
                                            key={type}
                                            onClick={() => { setData({...data, service: type}); setStep(2); }}
                                            className="w-full py-4 px-6 border-2 border-slate-200 rounded-xl font-semibold hover:border-gold hover:bg-amber-50 transition-all text-left flex justify-between items-center"
                                        >
                                            {type} <i data-lucide="chevron-right" className="w-5 h-5"></i>
                                        </button>
                                    ))}
                                </div>
                            </div>
                        )}

                        {step === 2 && (
                            <div>
                                <h3 className="text-2xl font-bold mb-6 text-center">Project Timeline?</h3>
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                    {['ASAP', '1-2 Weeks', 'Flexible'].map(time => (
                                        <button 
                                            key={time}
                                            onClick={() => { setData({...data, urgency: time}); setStep(3); }}
                                            className="w-full py-4 px-6 border-2 border-slate-200 rounded-xl font-semibold hover:border-gold transition-all"
                                        >
                                            {time}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        )}

                        {step === 3 && (
                            <div>
                                <h3 className="text-2xl font-bold mb-6 text-center">Secure Your Instant Quote</h3>
                                <div className="space-y-4">
                                    <input type="text" placeholder="Full Name" className="w-full p-4 border rounded-xl outline-none focus:ring-2 focus:ring-gold" />
                                    <input type="tel" placeholder="Phone Number" className="w-full p-4 border rounded-xl outline-none focus:ring-2 focus:ring-gold" />
                                    <button className="w-full bg-navy text-white py-4 rounded-xl font-bold text-lg hover:bg-slate-800 transition-all">
                                        Submit for Estimate
                                    </button>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const BeforeAfter = () => {
            const [position, setPosition] = useState(50);
            const containerRef = useRef(null);

            const handleMove = (e) => {
                const rect = containerRef.current.getBoundingClientRect();
                const x = e.clientX || e.touches[0].clientX;
                const pos = ((x - rect.left) / rect.width) * 100;
                setPosition(Math.min(Math.max(pos, 0), 100));
            };

            return (
                <section className="py-20 bg-white">
                    <div className="container mx-auto px-4">
                        <div className="text-center mb-12">
                            <h2 className="text-4xl font-extrabold mb-4">Our Craftsmanship Speaks for Itself</h2>
                            <p className="text-slate-600">Slide to see the [BUSINESS_NAME] transformation.</p>
                        </div>
                        <div 
                            ref={containerRef}
                            className="before-after-container cursor-ew-resize max-w-5xl mx-auto shadow-2xl border-4 border-white"
                            onMouseMove={handleMove}
                            onTouchMove={handleMove}
                        >
                            <div className="absolute inset-0">
                                <img src="https://images.unsplash.com/photo-1581858726788-75bc0f6a952d?auto=format&fit=crop&q=80&w=1200" className="w-full h-full object-cover" alt="After" />
                            </div>
                            <div 
                                className="absolute inset-0 overflow-hidden" 
                                style={{ width: `${position}%`, borderRight: '4px solid white' }}
                            >
                                <img src="https://images.unsplash.com/photo-1562664377-709f2c337eb2?auto=format&fit=crop&q=80&w=1200" className="w-[100vw] h-full object-cover max-w-none" alt="Before" />
                            </div>
                            <div className="absolute top-1/2 left-1/2 -translate-y-1/2 -translate-x-1/2 w-12 h-12 bg-gold rounded-full flex items-center justify-center shadow-xl pointer-events-none animate-pulse-subtle" style={{ left: `${position}%` }}>
                                <i data-lucide="arrow-left-right" className="text-navy w-6 h-6"></i>
                            </div>
                        </div>
                    </div>
                </section>
            );
        };

        const Services = () => (
            <section className="py-20 bg-slate-50">
                <div className="container mx-auto px-4">
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8">
                        {[
                            { title: 'Home Interior', icon: 'paintbrush', desc: 'Premium paints and flawless finishes that breathe new life into your living spaces.' },
                            { title: 'Exterior Protective', icon: 'home', desc: 'Weather-resistant coatings designed to protect your home from [CITY_NAME] elements.' },
                            { title: 'Cabinet Refinishing', icon: 'layout', desc: 'A factory-grade finish for your kitchen cabinets at a fraction of remodel costs.' },
                            { title: 'Commercial Painting', icon: 'building-2', desc: 'Efficient, high-capacity crews for offices, warehouses, and retail spaces.' }
                        ].map((s, idx) => (
                            <div key={idx} className="bg-white p-8 rounded-2xl shadow-soft hover:-translate-y-2 transition-all duration-300">
                                <div className="w-14 h-14 bg-amber-100 rounded-xl flex items-center justify-center mb-6 text-gold">
                                    <i data-lucide={s.icon}></i>
                                </div>
                                <h3 className="text-xl font-bold mb-3">{s.title}</h3>
                                <p className="text-slate-600 leading-relaxed">{s.desc}</p>
                            </div>
                        ))}
                    </div>
                </div>
            </section>
        );

        const App = () => {
            useEffect(() => {
                lucide.createIcons();
            }, []);

            return (
                <div className="pb-20 md:pb-0">
                    <Nav />

                    {/* HERO SECTION */}
                    <section className="relative h-[85vh] flex items-center justify-center text-center text-white">
                        <div className="absolute inset-0 z-0">
                            <img src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&q=80&w=1920" className="w-full h-full object-cover" />
                            <div className="absolute inset-0 hero-overlay"></div>
                        </div>
                        
                        <div className="relative z-10 container mx-auto px-4">
                            <span className="inline-block bg-gold/20 backdrop-blur-md border border-gold/50 text-gold font-bold px-4 py-2 rounded-full mb-6">
                                #1 Rated Painter in [CITY_NAME]
                            </span>
                            <h1 className="text-4xl md:text-7xl font-extrabold mb-6 leading-tight">
                                Voted [CITY_NAME]'s #1 <br />
                                <span className="text-gold uppercase">Premium Contractor.</span>
                            </h1>
                            <p className="text-xl md:text-2xl mb-10 max-w-2xl mx-auto text-slate-200">
                                Flawless interior and exterior painting with a [YEARS_IN_BUSINESS]-year guarantee. Fully licensed, insured, and lead-safe.
                            </p>
                            <button className="bg-gold text-navy text-xl font-bold px-10 py-5 rounded-2xl shadow-2xl animate-pulse-subtle hover:scale-105 transition-transform">
                                Book Your Free Estimate Today
                            </button>
                            
                            <div className="mt-12 flex flex-wrap justify-center gap-8 text-sm font-semibold opacity-90">
                                <div className="flex items-center gap-2"><i data-lucide="star" className="fill-gold text-gold w-5 h-5"></i> 150+ Google Reviews</div>
                                <div className="flex items-center gap-2"><i data-lucide="shield-check" className="text-gold w-5 h-5"></i> Licensed & Insured</div>
                                <div className="flex items-center gap-2"><i data-lucide="check-circle" className="text-gold w-5 h-5"></i> Clean Site Guarantee</div>
                            </div>
                        </div>
                    </section>

                    <QuoteCalculator />
                    <BeforeAfter />
                    <Services />

                    {/* FOOTER */}
                    <footer className="bg-navy text-white pt-20 pb-10">
                        <div className="container mx-auto px-4 grid grid-cols-1 md:grid-cols-4 gap-12 border-b border-slate-700 pb-12 mb-10">
                            <div>
                                <h3 className="text-2xl font-bold mb-6 text-gold">[BUSINESS_NAME]</h3>
                                <p className="text-slate-400 mb-4">Setting the standard for quality painting in [CITY_NAME] and surrounding areas.</p>
                                <p className="text-sm text-slate-500 underline">License: [LICENSE_NUMBER]</p>
                            </div>
                            <div>
                                <h4 className="font-bold mb-6">Service Areas</h4>
                                <ul className="text-slate-400 space-y-2">
                                    <li>Downtown [CITY_NAME]</li>
                                    <li>West [CITY_NAME]</li>
                                    <li>North [CITY_NAME]</li>
                                    <li>Surrounding Suburbs</li>
                                </ul>
                            </div>
                            <div>
                                <h4 className="font-bold mb-6">Contact</h4>
                                <ul className="text-slate-400 space-y-2">
                                    <li>[PHONE_NUMBER]</li>
                                    <li>[MAIN_EMAIL]</li>
                                    <li>Mon-Sat: 8am - 6pm</li>
                                </ul>
                            </div>
                            <div className="rounded-xl overflow-hidden h-48 bg-slate-800">
                                {/* Placeholder for Google Maps */}
                                <div className="w-full h-full flex items-center justify-center text-slate-500">
                                    <i data-lucide="map-pin" className="w-8 h-8"></i>
                                </div>
                            </div>
                        </div>
                        <p className="text-center text-slate-500 text-sm">© 2024 [BUSINESS_NAME]. All Rights Reserved.</p>
                    </footer>

                    {/* MOBILE STICKY BOTTOM */}
                    <div className="fixed bottom-0 left-0 right-0 z-50 flex md:hidden h-16 shadow-2xl">
                        <a href="tel:[PHONE_NUMBER]" className="flex-1 bg-emerald-600 text-white flex items-center justify-center font-bold gap-2">
                            <i data-lucide="phone" className="w-5 h-5"></i> Call Now
                        </a>
                        <button onClick={() => window.scrollTo({top: 600, behavior: 'smooth'})} className="flex-1 bg-amber-500 text-navy flex items-center justify-center font-bold gap-2">
                            <i data-lucide="calendar" className="w-5 h-5"></i> Free Quote
                        </button>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

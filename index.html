<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luma Skin | Premium Botanical Care</title>
    <meta name="description" content="Experience the purity of Luma Skin. Radiant glow, zero compromise.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500&family=Manrope:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

    <style>
        :root {
            --bg-color: #0a0a0a;
            --text-color: #ffffff;
            --accent-color: #ffffff;
            --muted-color: rgba(255, 255, 255, 0.75);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.15);
            --font-main: 'Inter', sans-serif;
            --font-heading: 'Playfair Display', serif;
            --font-nav: 'Manrope', sans-serif;

            /* Dynamic Background Variables (Default: Champagne) */
            --bg-inner: #d4af37;
            --bg-mid: #8a6327;
            --bg-outer: #2a1f1a;
            --rose-gold: #b76e79;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: radial-gradient(circle at center, var(--bg-inner) 0%, var(--bg-mid) 50%, var(--bg-outer) 100%);
            color: var(--text-color);
            font-family: var(--font-main);
            overflow: hidden;
            height: 100vh;
            transition: background 1.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body.slate-theme {
            --bg-inner: #4a5568;
            --bg-mid: #2d3748;
            --bg-outer: #12161f;
        }

        /* --- Living Background Fog --- */
        .vignette {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, transparent 30%, rgba(0,0,0,0.2) 100%);
            pointer-events: none;
            z-index: 1;
        }

        #orbs-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .orb-img {
            position: absolute;
            pointer-events: none;
            filter: blur(8px) brightness(1.2);
            background: radial-gradient(circle, rgba(255,255,255,0.4) 0%, transparent 70%);
            border-radius: 50%;
        }

        @keyframes floatUpImg {
            0% {
                transform: translateY(0) translateX(0) scale(0.8);
                opacity: 0;
            }
            20% { opacity: 0.3; }
            80% { opacity: 0.3; }
            100% {
                transform: translateY(-110vh) translateX(40px) scale(1.2);
                opacity: 0;
            }
        }

        /* --- Header --- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2.5rem 5%;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-weight: 400;
            font-size: 1.4rem;
            font-family: var(--font-heading);
            letter-spacing: 0.05em;
        }

        .nav {
            display: flex;
            gap: 0.5rem;
            background: var(--glass-bg);
            padding: 0.4rem;
            border-radius: 100px;
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
        }

        .nav-item {
            font-family: var(--font-nav);
            color: var(--muted-color);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 400;
            padding: 0.6rem 1.4rem;
            border-radius: 100px;
            transition: all 0.3s ease;
            letter-spacing: 0.02em;
        }

        .nav-item:hover, .nav-item.active {
            background: var(--rose-gold);
            color: #ffffff;
        }

        .contact-btn {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 0.9rem 2.2rem;
            border-radius: 100px;
            font-family: var(--font-main);
            font-weight: 400;
            font-size: 0.85rem;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .contact-btn:hover {
            background: white;
            color: #1a1a1a;
            transform: translateY(-2px);
        }

        /* --- Hero --- */
        .hero {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 5%;
            position: relative;
            z-index: 10;
        }

        .hero-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            height: 100%;
            position: relative;
        }

        .main-title,
        .side-title {
            font-family: var(--font-heading);
            font-size: clamp(4.5rem, 8vw, 10rem);
            line-height: 0.95;
            font-weight: 400;
            white-space: nowrap;
            color: white;
        }

        .main-title i,
        .side-title i {
            font-style: italic;
            font-weight: 300;
            color: var(--muted-color);
        }

        .hero-left {
            display: flex;
            flex-direction: column;
            gap: 2.5rem;
            z-index: 100;
            max-width: 500px;
        }

        .description {
            color: var(--muted-color);
            font-size: 1.05rem;
            line-height: 1.7;
            max-width: 400px;
            font-weight: 300;
        }

        .primary-btn {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 0.4rem 0.4rem 0.4rem 1.8rem;
            border-radius: 100px;
            font-family: var(--font-main);
            cursor: pointer;
            width: fit-content;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .primary-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-3px);
        }

        .plus-icon {
            background: var(--rose-gold);
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-size: 1.5rem;
            font-weight: 300;
        }

        .award-badge {
            display: flex;
            align-items: center;
            gap: 1.2rem;
            margin-top: 4rem;
        }

        .award-icon {
            width: 48px;
            height: 48px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .award-text { display: flex; flex-direction: column; }
        .award-title { font-size: 0.65rem; letter-spacing: 0.15em; color: var(--muted-color); text-transform: uppercase; }
        .award-subtitle { font-size: 0.85rem; font-weight: 400; }

        /* --- 3D Elements --- */
        .botanical-bg-container,
        .elements-container,
        .elements-container-bg {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .botanical-bg-container { z-index: -1; }
        .elements-container { z-index: 110; }
        .elements-container-bg { z-index: 0; }

        .botanical, .element {
            position: absolute;
            width: 80px;
            height: 80px;
            filter: drop-shadow(0 15px 30px rgba(0, 0, 0, 0.2));
            transition: transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .l1 { top: 15%; left: 12%; opacity: 0.4; }
        .l2 { top: 35%; left: 82%; width: 160px; height: 160px; opacity: 0.2; }
        .l3 { top: 75%; left: 70%; width: 90px; height: 90px; opacity: 0.3; }
        .l4 { top: 80%; left: 18%; width: 140px; height: 140px; opacity: 0.15; }

        .b1 { top: 20%; left: 28%; width: 180px; height: 180px; }
        .b2 { top: 65%; left: 40%; width: 100px; height: 100px; }
        .b3 { top: 25%; left: 65%; width: 220px; height: 220px; }
        .b4 { top: 15%; left: 52%; width: 140px; height: 140px; }
        .b5 { top: 72%; left: 22%; width: 130px; height: 130px; }
        .b6 { top: 48%; left: 78%; width: 160px; height: 160px; }
        .b7 { top: 18%; left: 42%; width: 90px; height: 90px; opacity: 0.8; }
        .b8 { top: 52%; left: 58%; width: 80px; height: 80px; opacity: 0.7; }
        .b9 { top: 82%; left: 38%; width: 85px; height: 85px; opacity: 0.8; }

        /* --- Center Product --- */
        .hero-center {
            position: absolute;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 50;
            opacity: 0;
            animation: fadeIn 2s ease-out 0.3s forwards, float 8s ease-in-out infinite;
            pointer-events: none;
            background: radial-gradient(circle at center, rgba(255, 255, 255, 0.08) 0%, transparent 60%);
        }

        @keyframes fadeIn { to { opacity: 1; } }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .main-product-3d {
            width: 80vw;
            height: 80vh;
            outline: none;
            --poster-color: transparent;
            --progress-bar-color: transparent;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(15deg);
            pointer-events: auto;
        }

        /* --- Right Carousel --- */
        .hero-right {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: flex-end;
            height: 100%;
            padding: 8rem 0;
            z-index: 100;
            width: 450px;
            pointer-events: none;
        }

        .product-carousel {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            align-items: flex-end;
            pointer-events: auto;
        }

        .carousel-cards { display: flex; gap: 1.2rem; }

        .card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 1.2rem;
            padding-top: 5rem;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            width: 140px;
            position: relative;
            backdrop-filter: blur(12px);
            text-align: center;
        }

        .card:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .card.active {
            border-color: var(--rose-gold);
            background: rgba(255, 255, 255, 0.08);
        }

        .card img {
            width: 120px;
            height: auto;
            margin-top: -8.5rem;
            filter: drop-shadow(0 15px 25px rgba(0, 0, 0, 0.3));
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) !important;
            display: block;
            pointer-events: none;
        }

        .card:hover img { transform: translateY(-20px) rotate(-8deg) scale(1.08) !important; }

        .card-info {
            display: flex;
            flex-direction: column;
            font-size: 0.75rem;
            width: 100%;
            letter-spacing: 0.05em;
        }

        .card-info span:first-child { font-weight: 500; text-transform: uppercase; margin-bottom: 4px; }
        .card-info span:last-child { color: var(--muted-color); font-weight: 300; }

        .carousel-nav { display: flex; gap: 0.8rem; }
        .nav-arrow {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .nav-arrow:hover { background: rgba(255, 255, 255, 0.15); transform: scale(1.05); }

        @media (max-width: 1200px) {
            .hero-content { flex-direction: column; justify-content: space-around; }
            .hero-left, .hero-right { align-items: center; text-align: center; width: 100%; padding: 2rem 0; }
            .main-title, .side-title { font-size: 3.5rem; white-space: normal; }
            .description { margin: 0 auto; }
            .product-carousel { align-items: center; }
            .award-badge { display: none; }
        }
    </style>
</head>
<body>
    <div id="orbs-container"></div>
    <div class="vignette"></div>

    <header class="header">
        <div class="logo">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2L15 9h7l-5.5 4.5L18 21l-6-4.5L6 21l1.5-7.5L2 9h7l3-7z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>

        <nav class="nav glass">

    <main class="hero">
        <div class="hero-content">
            <div class="botanical-bg-container">
                <model-viewer class="botanical l1" src="https://api.getlayers.ai/storage/v1/object/public/public/assets/soda-14ff8a788d/leaves.glb" environment-image="neutral" exposure="0.8" interaction-prompt="none" camera-orbit="45deg 75deg 105%"></model-viewer>
                <model-viewer class="botanical l2" src="https://api.getlayers.ai/storage/v1/object/public/public/assets/soda-14ff8a788d/leaves.glb" environment-image="neutral" exposure="0.8" interaction-prompt="none" camera-orbit="-30deg 60deg 105%"></model-viewer>
                <model-viewer class="botanical l3" src="https://api.getlayers.ai/storage/v1/object/public/public/assets/soda-14ff8a788d/leaves.glb" environment-image="neutral" exposure="0.8" interaction-prompt="none" camera-orbit="120deg 85deg 105%"></model-viewer>
                <model-viewer class="botanical l4" src="https://api.getlayers.ai/storage/v1/object/public/public/assets/soda-14ff8a788d/leaves.glb" environment-image="neutral" exposure="0.8" interaction-prompt="none" camera-orbit="10deg 45deg 105%"></model-viewer>
            </div>

            <div class="hero-left">
                <h1 class="main-title">

                    encased in pure elegance.
                </p>

                    <button class="primary-btn">

                        <span class="plus-icon">+</span>
                    </button>

                <div class="award-badge">
                    <div class="award-icon">

                            <path d="M12 15L15 18L19 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </div>
                    <div class="award-text">
                        <span class="award-title">DESIGN AWARDS</span>
                        <span class="award-subtitle">PREMIUM SKINCARE 2026</span>
                    </div>
                </div>
            </div>

            <div class="hero-center">
                <model-viewer id="product-model" 
                    src="https://modelviewer.dev/shared-assets/models/CosmeticBottle.glb" 
                    camera-controls disable-zoom shadow-intensity="1"

                <model-viewer class="element b7" src="https://modelviewer.dev/shared-assets/models/glTF-Sample-Models/2.0/IridescentDishWithStones/glTF/IridescentDishWithStones.gltf" exposure="1.0" interaction-prompt="none"></model-viewer>
                <model-viewer class="element b8" src="https://modelviewer.dev/shared-assets/models/glTF-Sample-Models/2.0/IridescentDishWithStones/glTF/IridescentDishWithStones.gltf" exposure="1.0" interaction-prompt="none"></model-viewer>
                <model-viewer class="element b9" src="https://modelviewer.dev/shared-assets/models/glTF-Sample-Models/2.0/IridescentDishWithStones/glTF/IridescentDishWithStones.gltf" exposure="1.0" interaction-prompt="none"></model-viewer>

                <model-viewer class="element b2" src="https://modelviewer.dev/shared-assets/models/glTF-Sample-Models/2.0/IridescentDishWithStones/glTF/IridescentDishWithStones.gltf" exposure="1.1"></model-viewer>
                <model-viewer class="element b3" src="https://modelviewer.dev/shared-assets/models/glTF-Sample-Models/2.0/IridescentDishWithStones/glTF/IridescentDishWithStones.gltf" exposure="1.1"></model-viewer>
                <model-viewer class="element b4" src="https://modelviewer.dev/shared-assets/models/glTF-Sample-Models/2.0/IridescentDishWithStones/glTF/IridescentDishWithStones.gltf" exposure="1.1"></model-viewer>
                <model-viewer class="element b5" src="https://modelviewer.dev/shared-assets/models/glTF-Sample-Models/2.0/IridescentDishWithStones/glTF/IridescentDishWithStones.gltf" exposure="1.1"></model-viewer>
                <model-viewer class="element b6" src="https://modelviewer.dev/shared-assets/models/glTF-Sample-Models/2.0/IridescentDishWithStones/glTF/IridescentDishWithStones.gltf" exposure="1.1"></model-viewer>

    <script>
        const modelViewer = document.querySelector('#product-model');
        const elementsFG = document.querySelector('.elements-container');
        const elementsBG = document.querySelector('.elements-container-bg');
        const botanicalsBG = document.querySelector('.botanical-bg-container');
        const allElements = document.querySelectorAll('.element');
        const cards = document.querySelectorAll('.card');
        let isSwitching = false;
        let switchSpin = 0;

        const PETAL_GLB = "https://modelviewer.dev/shared-assets/models/glTF-Sample-Models/2.0/IridescentDishWithStones/glTF/IridescentDishWithStones.gltf";
        const STONE_GLB = "https://api.getlayers.ai/storage/v1/object/public/public/assets/soda-14ff8a788d/blueberry.glb";

        cards.forEach(card => {
            card.addEventListener('click', () => {
                if (isSwitching) return;
                cards.forEach(c => c.classList.remove('active'));
                card.classList.add('active');
                switchRoutine(card.dataset.routine);
            });
        });

        async function switchRoutine(routine) {
            if (isSwitching) return;
            isSwitching = true;
            const body = document.body;
            const heroCenter = document.querySelector('.hero-center');

            const targetColors = routine === 'night' ?
                { inner: '#4a5568', mid: '#2d3748', outer: '#12161f' } :
                { inner: '#d4af37', mid: '#8a6327', outer: '#2a1f1a' };

            gsap.to(body, {
                '--bg-inner': targetColors.inner,
                '--bg-mid': targetColors.mid,
                '--bg-outer': targetColors.outer,
                duration: 1.5,
                ease: 'power2.inOut'
            });

            const spinObj = { val: 0, blur: 0 };
            gsap.to(spinObj, {
                val: 360,
                blur: 15,
                duration: 0.6,
                ease: "power2.in",
                onUpdate: () => {
                    switchSpin = spinObj.val;
                    modelViewer.style.filter = `blur(${spinObj.blur}px)`;
                },
                onComplete: async () => {
                    if (routine === 'night') {
                        body.classList.add('slate-theme');
                    } else {
                        body.classList.remove('slate-theme');
                    }

                    gsap.to(spinObj, {
                        val: 720,
                        blur: 0, 
                        duration: 1.5, 
                        ease: "back.out(0.7)",
                        onUpdate: () => {
                            switchSpin = spinObj.val;
                            modelViewer.style.filter = `blur(${spinObj.blur}px)`;
                        },
                        onComplete: () => {
                            switchSpin = 0;
                            modelViewer.style.filter = 'none';
                        }
                    });
                }
            });

            let completed = 0;
            allElements.forEach((el, i) => {
                const bW = el.offsetWidth / 2;
                const bH = el.offsetHeight / 2;
                const centerX = (window.innerWidth / 2 - el.offsetLeft - bW);
                const centerY = (window.innerHeight / 2 - el.offsetTop - bH);

                const startAngle = parseFloat(el.dataset.angle) || 0;
                const currentX = parseFloat(el.dataset.baseX) || 0;
                const currentY = parseFloat(el.dataset.baseY) || 0;
                const nextX = (Math.random() - 0.5) * 200;
                const nextY = (Math.random() - 0.5) * 200;

                gsap.timeline()
                    .to(el, { x: centerX, y: centerY, rotation: startAngle + 45, scale: 0.1, opacity: 0, duration: 0.5, ease: "power2.in" })
                    .set(el, { onComplete: () => { el.src = routine === 'night' ? STONE_GLB : PETAL_GLB; heroCenter.style.zIndex = 50; } })
                    .to(el, { duration: 0.3 })
                    .to(el, {
                        onStart: () => { heroCenter.style.zIndex = 1; },
                        x: nextX, y: nextY, scale: 1, opacity: 1, rotation: startAngle + 90, duration: 0.9, ease: "back.out(1.5)",
                        onComplete: () => {
                            el.dataset.angle = startAngle + 90; el.dataset.baseX = nextX; el.dataset.baseY = nextY;
                            el.dataset.rx = 0; el.dataset.ry = 0;
                            completed++;
                            if (completed === allElements.length) isSwitching = false;
                        }
                    });
            });
        }

        allElements.forEach(b => {
            b.dataset.rx = 0; b.dataset.ry = 0; b.dataset.angle = Math.random() * 360;
            b.dataset.baseX = 0; b.dataset.baseY = 0;
        });

        let mouse = { x: 0, y: 0, px: 0, py: 0 }, currentMouse = { x: 0, y: 0 };
        window.addEventListener('mousemove', e => {
            mouse.x = (e.clientX / window.innerWidth) - 0.5;
            mouse.y = (e.clientY / window.innerHeight) - 0.5;
            mouse.px = e.clientX; mouse.py = e.clientY;
        });

        function animate() {
            const time = Date.now() * 0.001;
            currentMouse.x += (mouse.x - currentMouse.x) * 0.05;
            currentMouse.y += (mouse.y - currentMouse.y) * 0.05;

            modelViewer.cameraOrbit = `${(currentMouse.x * 40) + switchSpin}deg ${90 + (currentMouse.y * 20)}deg 380%`;
            elementsFG.style.transform = `translate(${currentMouse.x * 60}px, ${currentMouse.y * 60}px)`;
            elementsBG.style.transform = `translate(${currentMouse.x * -30}px, ${currentMouse.y * -30}px)`;
            botanicalsBG.style.transform = `translate(${currentMouse.x * -15}px, ${currentMouse.y * -15}px)`;

            if (!isSwitching) {
                allElements.forEach((el, i) => {
                    const rect = el.getBoundingClientRect();
                    const dist = Math.sqrt(Math.pow(mouse.px - (rect.left + rect.width/2), 2) + Math.pow(mouse.py - (rect.top + rect.height/2), 2));
                    let tRx = 0, tRy = 0, speed = 1;
                    if (dist < 400) {
                        const force = (400 - dist) / 400;
                        tRx = ((mouse.px - (rect.left + rect.width/2)) / dist) * force * -80;
                        tRy = ((mouse.py - (rect.top + rect.height/2)) / dist) * force * -80;
                        speed = 1 + force * 5;
                    }
                    let rx = parseFloat(el.dataset.rx) || 0, ry = parseFloat(el.dataset.ry) || 0, ang = parseFloat(el.dataset.angle) || 0;
                    rx += (tRx - rx) * 0.1; ry += (tRy - ry) * 0.1; ang += 0.2 * speed;
                    el.dataset.rx = rx; el.dataset.ry = ry; el.dataset.angle = ang;
                    const phase = (time + i * 0.7) * (Math.PI * 2 / [5, 7, 6, 8, 5.5, 6.5, 9, 11, 10][i % 9]);
                    el.style.transform = `translate(calc(${rx + (parseFloat(el.dataset.baseX) || 0)}px), calc(${ry + (parseFloat(el.dataset.baseY) || 0)}px + ${Math.sin(phase) * 15}px)) rotate(calc(${ang}deg + ${Math.cos(phase) * 6}deg))`;
                });
            }
            requestAnimationFrame(animate);
        }
        animate();

        const container = document.getElementById('orbs-container');
        setInterval(() => {
            const orb = document.createElement('div');
            orb.className = 'orb-img';
            const size = Math.random() * 30 + 15;
            orb.style.width = size + 'px'; orb.style.height = size + 'px';
            orb.style.left = Math.random() * 100 + '%'; orb.style.bottom = '-60px';
            orb.style.opacity = Math.random() * 0.3 + 0.1;
            orb.style.animation = `floatUpImg ${Math.random() * 8 + 5}s linear forwards`;
            container.appendChild(orb);
            setTimeout(() => orb.remove(), 13000);
        }, 500);
    </script>
</body>
</html>

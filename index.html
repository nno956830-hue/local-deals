<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUMA SKIN | The Molecular Ritual</title>
    <meta name="description" content="Luxury biotechnology meets clinical skincare. An award-winning interactive experience.">
    
    <!-- Luxury Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@100;200;300;400;500&family=Montserrat:wght@200;300;400&display=swap" rel="stylesheet">
    
    <!-- High-Performance Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

    <style>
        :root {
            --color-pearl: #FFFFFF;
            --color-ivory: #FDFBF7;
            --color-sand: #E8E4DE;
            --color-stone: #D1CDC7;
            --color-champagne: #C5A059;
            --text-primary: #1A1A1A;
            --text-muted: rgba(26, 26, 26, 0.4);
            
            --bg-inner: #FFFFFF;
            --bg-mid: #F8F6F2;
            --bg-outer: #EAE7E1;
            
            --font-serif: 'Playfair Display', serif;
            --font-sans: 'Inter', sans-serif;
            --glass-blur: blur(40px);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            cursor: none; /* Custom premium cursor */
        }

        body {
            background: var(--bg-inner);
            color: var(--text-primary);
            font-family: var(--font-sans);
            overflow-x: hidden;
            height: 100vh;
            width: 100vw;
        }

        /* --- ATMOSPHERIC ENVIRONMENT --- */
        .living-bg {
            position: fixed;
            inset: 0;
            z-index: -1;
            overflow: hidden;
            background: var(--bg-inner);
        }

        .bg-gradient {
            position: absolute;
            width: 150vw;
            height: 150vh;
            top: -25%;
            left: -25%;
            filter: blur(100px);
            opacity: 0.6;
            background: radial-gradient(circle at center, var(--bg-mid) 0%, transparent 70%);
            pointer-events: none;
        }

        .vignette {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, transparent 40%, rgba(0,0,0,0.03) 100%);
            pointer-events: none;
            z-index: 1;
        }

        .film-grain {
            position: fixed;
            inset: 0;
            opacity: 0.02;
            pointer-events: none;
            z-index: 9999;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* --- PREMIUM CURSOR --- */
        #cursor-follower {
            position: fixed;
            width: 8px;
            height: 8px;
            background: var(--text-primary);
            border-radius: 50%;
            pointer-events: none;
            z-index: 10000;
            mix-blend-mode: difference;
        }

        #cursor-ring {
            position: fixed;
            width: 40px;
            height: 40px;
            border: 1px solid var(--text-primary);
            border-radius: 50%;
            pointer-events: none;
            z-index: 10000;
            transition: transform 0.2s cubic-bezier(0.23, 1, 0.32, 1), opacity 0.3s;
            opacity: 0.3;
        }

        /* --- HEADER & NAVIGATION --- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2.5rem 5%;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
        }

        .logo {
            font-family: var(--font-serif);
            font-size: 1.6rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            font-weight: 400;
            position: relative;
        }

        .nav-editorial {
            display: flex;
            gap: 4rem;
        }

        .nav-link {
            text-decoration: none;
            color: var(--text-primary);
            font-size: 0.65rem;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            font-weight: 300;
            opacity: 0.6;
            transition: opacity 0.5s, letter-spacing 0.5s;
        }

        .nav-link:hover {
            opacity: 1;
            letter-spacing: 0.45em;
        }

        /* --- PRODUCT STAGE --- */
        .product-environment {
            position: fixed;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 5;
            perspective: 2000px;
        }

        .cosmetic-stage-floor {
            position: absolute;
            bottom: 10%;
            width: 80vw;
            height: 20vh;
            background: radial-gradient(50% 50% at 50% 50%, rgba(26, 26, 26, 0.05) 0%, transparent 100%);
            transform: rotateX(80deg);
            filter: blur(20px);
            opacity: 0.5;
        }

        .model-container {
            width: 80vw;
            height: 90vh;
            outline: none;
            --poster-color: transparent;
            pointer-events: auto;
            transform: translateY(0);
        }

        /* --- EDITORIAL CHAPTERS --- */
        .content-layer {
            position: relative;
            z-index: 10;
            pointer-events: none;
        }

        .chapter {
            height: 100vh;
            padding: 0 10%;
            display: flex;
            align-items: center;
            opacity: 0;
            pointer-events: none;
        }

        .chapter.active {
            pointer-events: auto;
        }

        .chapter-content {
            max-width: 600px;
        }

        .label-micro {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.5em;
            color: var(--color-champagne);
            margin-bottom: 2rem;
            display: block;
            transform: translateY(20px);
            opacity: 0;
        }

        .title-display {
            font-family: var(--font-serif);
            font-size: clamp(4rem, 8vw, 10rem);
            line-height: 0.9;
            margin-bottom: 2.5rem;
            opacity: 0;
            transform: translateY(40px);
        }

        .body-editorial {
            font-size: 1.1rem;
            line-height: 2;
            font-weight: 200;
            color: var(--text-muted);
            max-width: 400px;
            margin-bottom: 4rem;
            opacity: 0;
            transform: translateY(20px);
        }

        /* --- INTERACTIVE SELECTOR --- */
        .formula-dock {
            position: fixed;
            right: 5%;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            z-index: 100;
        }

        .formula-swatch {
            background: var(--glass-white);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            padding: 2rem;
            width: 260px;
            transition: all 1.2s cubic-bezier(0.23, 1, 0.32, 1);
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            position: relative;
            overflow: hidden;
        }

        .formula-swatch::after {
            content: '';
            position: absolute;
            top: -100%;
            left: -100%;
            width: 300%;
            height: 300%;
            background: linear-gradient(45deg, transparent 45%, rgba(255,255,255,0.4) 50%, transparent 55%);
            transform: rotate(-45deg);
            transition: transform 0s;
        }

        .formula-swatch:hover::after {
            transform: translate(100%, 100%) rotate(-45deg);
            transition: transform 1.5s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .formula-swatch.active {
            background: white;
            transform: translateX(-30px);
            box-shadow: 0 50px 100px rgba(0,0,0,0.06);
            border-color: var(--color-champagne);
        }

        .swatch-index {
            font-size: 0.6rem;
            letter-spacing: 0.3em;
            color: var(--color-champagne);
            text-transform: uppercase;
        }

        .swatch-title {
            font-family: var(--font-serif);
            font-size: 1.3rem;
            font-weight: 400;
        }

        /* --- THE WOW MOMENT: MOLECULAR MIST --- */
        #mist-canvas {
            position: fixed;
            inset: 0;
            z-index: 6;
            pointer-events: none;
            opacity: 0.4;
        }

        /* --- RESPONSIVE --- */
        @media (max-width: 1024px) {
            .chapter { padding-top: 15vh; align-items: flex-start; text-align: center; justify-content: center; }
            .chapter-content { max-width: 100%; }
            .formula-dock { bottom: 5%; top: auto; right: 0; left: 0; flex-direction: row; justify-content: center; transform: none; width: 100%; }
            .formula-swatch { width: 140px; padding: 1rem; }
            .swatch-title { font-size: 0.9rem; }
        }
    </style>
</head>
<body>
    <div class="film-grain"></div>
    <div class="vignette"></div>
    <div id="cursor-follower"></div>
    <div id="cursor-ring"></div>

    <div class="living-bg">
        <div class="bg-gradient" id="grad-1"></div>
        <div class="bg-gradient" id="grad-2"></div>
    </div>

    <header class="header">
        <div class="logo">LUMA</div>
        <nav class="nav-editorial">
            <a href="#" class="nav-link active">Atelier</a>
            <a href="#" class="nav-link">Science</a>
            <a href="#" class="nav-link">Ritual</a>
            <a href="#" class="nav-link">Inquiry</a>
        </nav>
    </header>

    <div class="product-environment">
        <div class="cosmetic-stage-floor"></div>
        <model-viewer id="main-bottle" 
            src="https://modelviewer.dev/shared-assets/models/CosmeticBottle.glb"
            exposure="1.2"
            environment-image="neutral"
            shadow-intensity="0.8"
            shadow-softness="1"
            camera-orbit="0deg 88deg 105%"
            interaction-prompt="none"
            disable-zoom
            class="model-container">
        </model-viewer>
    </div>

    <canvas id="mist-canvas"></canvas>

    <main class="content-layer">
        <!-- Chapter 1: The Intro -->
        <section class="chapter active" id="chapter-intro">
            <div class="chapter-content">
                <span class="label-micro">Molecular Skincare Atelier</span>
                <h1 class="title-display">Skin,<br><i>Reimagined.</i></h1>
                <p class="body-editorial">Clinical precision meets editorial elegance. We engineer the future of luminosity through molecular biotechnology.</p>
            </div>
        </section>
    </main>

    <aside class="formula-dock">
        <div class="formula-swatch active" data-formula="hydration" data-accent="#C5A059">
            <span class="swatch-index">Ritual 01</span>
            <span class="swatch-title">Molecular Hydration</span>
        </div>
        <div class="formula-swatch" data-formula="radiance" data-accent="#D8B4A0">
            <span class="swatch-index">Ritual 02</span>
            <span class="swatch-title">Vitamin C Complex</span>
        </div>
        <div class="formula-swatch" data-formula="renewal" data-accent="#A0B1D8">
            <span class="swatch-index">Ritual 03</span>
            <span class="swatch-title">Cellular Night Repair</span>
        </div>
    </aside>

    <script>
        /**
         * PRESERVED ENGINEERING: GSAP Interaction Foundation
         */
        const bottle = document.querySelector('#main-bottle');
        const follower = document.querySelector('#cursor-follower');
        const ring = document.querySelector('#cursor-ring');
        const swatches = document.querySelectorAll('.formula-swatch');
        
        let currentSpin = 0;
        let isLocked = false;
        let mouseX = 0, mouseY = 0;

        // --- PREMIUM CURSOR ENGINE ---
        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            gsap.to(follower, { x: mouseX, y: mouseY, duration: 0.1 });
            gsap.to(ring, { x: mouseX - 16, y: mouseY - 16, duration: 0.4, ease: "power3.out" });
        });

        // --- ENTRANCE CHOREOGRAPHY ---
        window.addEventListener('load', () => {
            const tl = gsap.timeline({ defaults: { ease: "expo.out", duration: 2.5 }});
            
            tl.to(".logo", { opacity: 1, y: 0, duration: 2 })
              .from(".nav-link", { opacity: 0, y: -10, stagger: 0.1 }, "-=1.5")
              .to("#main-bottle", { opacity: 1, y: 0, duration: 3 }, "-=2")
              .to(".label-micro", { opacity: 1, y: 0 }, "-=2.5")
              .to(".title-display", { opacity: 1, y: 0 }, "-=2.3")
              .to(".body-editorial", { opacity: 1, y: 0 }, "-=2.1")
              .from(".formula-swatch", { opacity: 0, x: 50, stagger: 0.2 }, "-=1.8");

            initMist();
            animateBackground();
            renderLoop();
        });

        // --- DYNAMIC BACKGROUND ENGINE ---
        function animateBackground() {
            gsap.to("#grad-1", {
                x: "20%", y: "10%", 
                duration: 20, 
                repeat: -1, 
                yoyo: true, 
                ease: "sine.inOut"
            });
            gsap.to("#grad-2", {
                x: "-20%", y: "-10%", 
                duration: 25, 
                repeat: -1, 
                yoyo: true, 
                ease: "sine.inOut",
                delay: 2
            });
        }

        // --- PRODUCT SWITCHING ART DIRECTION ---
        swatches.forEach(swatch => {
            swatch.addEventListener('click', () => {
                if (isLocked || swatch.classList.contains('active')) return;
                isLocked = true;
                
                swatches.forEach(s => s.classList.remove('active'));
                swatch.classList.add('active');

                const formula = swatch.dataset.formula;
                const accent = swatch.dataset.accent;
                
                performFormulaTransition(formula, accent);
            });
        });

        function performFormulaTransition(type, color) {
            const tl = gsap.timeline({ onComplete: () => isLocked = false });
            
            // 1. Cinematic Background Morph
            const colorMap = {
                hydration: { inner: "#FFFFFF", outer: "#EAE7E1" },
                radiance: { inner: "#FFFBF5", outer: "#F2E8D5" },
                renewal: { inner: "#F8F9FB", outer: "#D9E2EC" }
            };

            tl.to("body", { 
                backgroundColor: colorMap[type].inner, 
                duration: 2.5, 
                ease: "power2.inOut" 
            }, 0);

            // 2. Camera / Bottle Event
            const targetSpin = currentSpin + 360;
            gsap.to({ val: currentSpin }, {
                val: targetSpin,
                duration: 2.2,
                ease: "expo.inOut",
                onUpdate: function() {
                    currentSpin = this.targets()[0].val;
                    // Soft blur event during rotation peak
                    const progress = this.progress();
                    const blurVal = Math.sin(progress * Math.PI) * 15;
                    bottle.style.filter = `blur(${blurVal}px) saturate(${1 + Math.sin(progress * Math.PI) * 0.5})`;
                },
                onComplete: () => bottle.style.filter = 'none'
            });

            // 3. UI Content Swap with Stagger
            tl.to(".chapter-content > *", { 
                opacity: 0, y: -20, stagger: 0.05, duration: 0.6, 
                onComplete: () => {
                    // Update text based on formula
                    const data = {
                        hydration: ["Molecular Hydration", "Formula NÂ° 01: Scientific moisture lock engineered for crystalline luminosity."],
                        radiance: ["Vitamin C Complex", "Formula NÂ° 02: High-potency antioxidant complex optimized for tonal clarity."],
                        renewal: ["Cellular Night Repair", "Formula NÂ° 03: Biomimetic lipid complex for mitochondrial repair."]
                    };
                    document.querySelector('.title-display').innerHTML = data[type][0].replace(' ', '<br>') + ',<br><i>Reimagined.</i>';
                    document.querySelector('.body-editorial').innerText = data[type][1];
                    gsap.to(".chapter-content > *", { opacity: 1, y: 0, stagger: 0.1, duration: 1 });
                }
            }, 0.2);
        }

        // --- RENDER LOOP: PARALLAX & BREATHING ---
        function renderLoop() {
            const time = Date.now() * 0.001;
            
            // Smooth Parallax
            const targetX = (mouseX / window.innerWidth - 0.5);
            const targetY = (mouseY / window.innerHeight - 0.5);
            
            // Idle Breathing
            const breath = Math.sin(time * 0.8) * 15;
            const tiltX = targetX * 30 + currentSpin;
            const tiltY = 88 + (targetY * 12) + Math.cos(time * 0.5) * 2;
            
            bottle.cameraOrbit = `${tiltX}deg ${tiltY}deg 105%`;
            
            requestAnimationFrame(renderLoop);
        }

        // --- MOLECULAR MIST (CANVAS ENGINE) ---
        function initMist() {
            const canvas = document.querySelector('#mist-canvas');
            const ctx = canvas.getContext('2d');
            let particles = [];

            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            class Particle {
                constructor() {
                    this.reset();
                }
                reset() {
                    this.x = Math.random() * canvas.width;
                    this.y = Math.random() * canvas.height;
                    this.size = Math.random() * 40 + 20;
                    this.opacity = Math.random() * 0.3;
                    this.vx = (Math.random() - 0.5) * 0.3;
                    this.vy = (Math.random() - 0.5) * 0.3;
                }
                update() {
                    this.x += this.vx;
                    this.y += this.vy;
                    if (this.x < -100 || this.x > canvas.width + 100 || this.y < -100 || this.y > canvas.height + 100) this.reset();
                }
                draw() {
                    ctx.beginPath();
                    const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size);
                    grad.addColorStop(0, `rgba(255, 255, 255, ${this.opacity})`);
                    grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
                    ctx.fillStyle = grad;
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            for (let i = 0; i < 25; i++) particles.push(new Particle());

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach(p => {
                    p.update();
                    p.draw();
                });
                requestAnimationFrame(animate);
            }
            animate();
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diet Soda | Pure Zero Refreshment</title>
    <meta name="description" content="Experience the crisp, clean taste of Diet Soda. Zero sugar, zero compromise.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Inter:wght@400;500&family=Manrope:wght@400;700&family=Galada&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --text-color: #ffffff;
            --accent-color: #ffffff;
            --muted-color: rgba(255, 255, 255, 0.7);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --font-main: 'Inter', sans-serif;
            --font-heading: 'Galada', cursive;
            --bg-inner: #0b8a78;
            --bg-mid: #044e3b;
            --bg-outer: #011411;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at center, var(--bg-inner) 0%, var(--bg-mid) 50%, var(--bg-outer) 100%);
            color: var(--text-color);
            font-family: var(--font-main);
            overflow: hidden;
            height: 100vh;
            transition: background 1.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body.blue-theme {
            --bg-inner: #0b4f8a;
            --bg-mid: #04294e;
            --bg-outer: #010c14;
        }

        #bubbles-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .bubble-img {
            position: absolute;
            pointer-events: none;
        }

        @keyframes floatUpImg {
            0% {
                transform: translateY(0) translateX(0) rotate(0deg);
                opacity: 0;
            }
            10% { opacity: 0.4; }
            90% { opacity: 0.4; }
            100% {
                transform: translateY(-110vh) translateX(30px) rotate(360deg);
                opacity: 0;
            }
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2rem 4%;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 700;
            font-size: 1.2rem;
            font-family: var(--font-heading);
        }

        .nav {
            display: flex;
            gap: 0.5rem;
            background: var(--glass-bg);
            padding: 0.4rem;
            border-radius: 100px;
            border: 1px solid var(--glass-border);
            position: relative;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1), inset 0 0 0 1px rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .nav-item {
            font-family: 'Manrope', sans-serif;
            color: var(--muted-color);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            padding: 0.5rem 1.2rem;
            border-radius: 100px;
            transition: all 0.3s ease;
        }

        .nav-item:hover, .nav-item.active {
            background: #fbcfe8;
            color: #011d17;
        }

        .contact-btn {
            background: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            padding: 0.9rem 2rem;
            border-radius: 100px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .contact-btn:hover {
            background: rgba(0, 0, 0, 0.7);
            transform: translateY(-2px);
        }

        .hero {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 4%;
            padding-top: 5rem;
        }

        .hero-content {
            display: flex;
            justify-content: space-between;
            align-items: stretch;
            width: 100%;
            max-width: 100%;
            padding: 0;
            height: 100%;
            position: relative;
        }

        .main-title, .side-title {
            font-family: var(--font-heading);
            font-size: clamp(5rem, 10vw, 12rem);
            line-height: 0.8;
            font-weight: 400;
            text-transform: none;
            white-space: nowrap;
            color: white;
            letter-spacing: normal;
        }

        .outline {
            color: transparent;
            -webkit-text-stroke: 1.5px white;
        }

        .leaves-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: -1;
            transition: transform 0.1s ease-out;
        }

        .leaf {
            position: absolute;
            width: 60px; height: 60px;
            pointer-events: none;
            filter: drop-shadow(0 5px 15px rgba(0, 0, 0, 0.2));
        }

        .l1 { top: 10%; left: 15%; }
        .l2 { top: 40%; left: 80%; width: 140px; height: 140px; opacity: 0.4; }
        .l3 { top: 70%; left: 75%; width: 80px; height: 80px; }
        .l4 { top: 85%; left: 20%; width: 120px; height: 120px; opacity: 0.3; }

        .hero-left {
            display: flex; flex-direction: column; height: 100%;
            padding: 6rem 0; gap: 2rem; z-index: 100;
        }

        .description {
            color: var(--muted-color); font-size: 1.1rem; line-height: 1.6; max-width: 400px;
        }

        .primary-btn {
            display: flex; align-items: center; gap: 1.5rem; background: rgba(0, 0, 0, 0.5);
            color: white; border: none; padding: 0.4rem 0.4rem 0.4rem 1.5rem;
            border-radius: 100px; font-weight: 700; cursor: pointer; width: fit-content;
            transition: all 0.3s ease;
        }

        .primary-btn:hover { background: rgba(0, 0, 0, 0.7); transform: translateY(-3px); }

        .plus-icon {
            background: #fbcfe8; color: #011d17; width: 38px; height: 38px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%; font-size: 1.4rem; font-weight: 900; line-height: 1;
            padding-bottom: 2px; border: none;
        }

        .award-badge {
            display: flex; align-items: center; gap: 1rem; margin-top: auto;
        }

        .award-icon {
            width: 48px; height: 48px; background: var(--glass-bg);
            border: 1px solid var(--glass-border); border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
        }

        .award-text { display: flex; flex-direction: column; }
        .award-title { font-size: 0.7rem; letter-spacing: 0.1em; color: var(--muted-color); }
        .award-subtitle { font-size: 0.85rem; font-weight: 600; }

        .hero-center {
            display: flex; justify-content: center; align-items: center;
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1; opacity: 0;
            animation: fadeIn 1.5s ease-out 0.3s forwards, float 6s ease-in-out infinite;
            pointer-events: none;
            background: radial-gradient(circle at center, rgba(16, 185, 129, 0.1) 0%, transparent 70%);
        }

        @keyframes fadeIn { to { opacity: 1; } }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .main-product-3d {
            width: 80vw; height: 80vh; outline: none;
            --progress-bar-color: transparent;
            --poster-color: transparent;
            z-index: 1; position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%) rotate(25deg);
            pointer-events: auto;
        }

        .berries-container, .berries-container-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; transition: transform 0.1s ease-out;
        }

        .berries-container { z-index: 110; }
        .berries-container-bg { z-index: 0; }

        .berry {
            position: absolute; width: 120px; height: 120px; outline: none;
            filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.3));
            transition: transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .hero-right {
            display: flex; flex-direction: column; justify-content: space-between;
            align-items: flex-end; text-align: right; height: 100%;
            padding: 6rem 0; z-index: 100; width: 450px; pointer-events: none;
        }

        .product-carousel {
            display: flex; flex-direction: column; gap: 1.5rem;
            align-items: flex-end; pointer-events: auto;
        }

        .carousel-cards { display: flex; gap: 1rem; }

        .card {
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            padding: 1rem; padding-top: 5rem; border-radius: 28px;
            display: flex; flex-direction: column; align-items: center;
            gap: 1.5rem; cursor: pointer; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            width: 135px; position: relative; backdrop-filter: blur(10px);
        }

        .card:hover { background: rgba(255, 255, 255, 0.12); border-color: rgba(255, 255, 255, 0.4); }
        .card.active { border-color: #fbcfe8; }

        .card img {
            width: 140px; height: auto; margin-top: -8rem;
            filter: drop-shadow(0 20px 35px rgba(0, 0, 0, 0.5));
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) !important;
            display: block; pointer-events: none;
        }

        .card:hover img { transform: translateY(-30px) rotate(-12deg) scale(1.15) !important; }

        .card-info { display: flex; flex-direction: column; font-size: 0.7rem; text-align: center; }
        .card-info span:first-child { font-weight: 600; }
        .card-info span:last-child { color: var(--muted-color); }

        .nav-arrow { 
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            color: white; width: 36px; height: 36px; border-radius: 50%;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
        }

        @media (max-width: 1200px) {
            .main-product-3d { width: 100vw; height: 60vh; top: 40%; }
            .hero-content { flex-direction: column; padding-top: 8rem; align-items: center; }
            .main-title, .side-title { font-size: 5rem; }
            .hero-left, .hero-right { width: 100%; align-items: center; text-align: center; height: auto; padding: 2rem 0; }
        }
    </style>
</head>
<body>
    <div id="bubbles-container"></div>

    <header class="header">
        <div class="logo">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none">
                <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" />
                <path d="M12 8V16M8 12H16" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            </svg>
            <span>Soda</span>
        </div>
        <nav class="nav glass">
            <a href="#" class="nav-item active">Home</a>
            <a href="#" class="nav-item">Ingredients</a>
            <a href="#" class="nav-item">Taste</a>
            <a href="#" class="nav-item">Eco</a>
            <a href="#" class="nav-item">Reviews</a>
        </nav>
        <button class="contact-btn">Contact Us</button>
    </header>

    <main class="hero">
        <div class="hero-content">
            <div class="leaves-container">
                <model-viewer class="leaf l1" src="https://api.getlayers.ai/storage/v1/object/public/public/assets/soda-14ff8a788d/leaves.glb" exposure="1.0" interaction-prompt="none" camera-orbit="45deg 75deg 105%"></model-viewer>
                <model-viewer class="leaf l2" src="https://api.getlayers.ai/storage/v1/object/public/public/assets/soda-14ff8a788d/leaves.glb" exposure="1.0" interaction-prompt="none" camera-orbit="-30deg 60deg 105%"></model-viewer>
                <model-viewer class="leaf l3" src="https://api.getlayers.ai/storage/v1/object/public/public/assets/soda-14ff8a788d/leaves.glb" exposure="1.0" interaction-prompt="none" camera-orbit="120deg 85deg 105%"></model-viewer>
                <model-viewer class="leaf l4" src="https://api.getlayers.ai/storage/v1/object/public/public/assets/soda-14ff8a788d/leaves.glb" exposure="1.0" interaction-prompt="none" camera-orbit="10deg 45deg 105%"></model-viewer>
            </div>

            <div class="hero-left">
                <h1 class="main-title">
                    <span class="outline">Pure</span><br>Zero
                </h1>
                <p class="description">
                    Unleash the crisp taste of zero sugar. Refreshment redefined in every bubble &mdash; all in one sleek design.
                </p>
                <button class="primary-btn">
                    Shop Now <span class="plus-icon">+</span>
                </button>
                <div class="award-badge">
                    <div class="award-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                            <path d="M12 15L15 18L19 14" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                        </svg>
                    </div>
                    <div class="award-text">
                        <span class="award-title">DESIGN AWARDS</span>
                        <span class="award-subtitle">PREMIUM BEVERAGE 2025</span>
                    </div>
                </div>
            </div>

            <div class="hero-center">
                <model-viewer id="product-model" src="https://api.getlayers.ai/storage/v1/object/public/public/assets/soda-14ff8a788d/deit_soda2.glb" camera-controls disable-zoom shadow-intensity="0" environment-image="neutral" exposure="1.5" interaction-prompt="none" camera-orbit="0deg 90deg 380%" field-of-view="30deg" class="main-product-3d"></model-viewer>
            </div>

            <div class="berries-container-bg">
                <model-viewer class="berry b7" src="https://api.getlayers.ai/storage/v1/object/public/public/assets/soda-14ff8a788d/cherry.glb" exposure="1.0" camera-orbit="-20deg 110deg 105%"></model-viewer>
                <model-viewer class="berry b8" src="https://api.getlayers.ai/storage/v1/object/public/public/assets/soda-14ff8a788d/cherry.glb" exposure="1.0" camera-orbit="160deg 45deg 105%"></model-viewer>
                <model-viewer class="berry b9" src="https://api.getlayers.ai/storage/v1/object/public/public/assets/soda-14ff8a788d/cherry.glb" exposure="1.0" camera-orbit="45deg 20deg 105%"></model-viewer>
            </div>

            <div class="berries-container">
                <model-viewer class="berry b1" src="https://api.getlayers.ai/storage/v1/object/public/public/assets/soda-14ff8a788d/cherry.glb" exposure="1.2"></model-viewer>
                <model-viewer class="berry b2" src="https://api.getlayers.ai/storage/v1/object/public/public/assets/soda-14ff8a788d/cherry.glb" exposure="1.2"></model-viewer>
                <model-viewer class="berry b3" src="https://api.getlayers.ai/storage/v1/object/public/public/assets/soda-14ff8a788d/cherry.glb" exposure="1.2"></model-viewer>
                <model-viewer class="berry b4" src="https://api.getlayers.ai/storage/v1/object/public/public/assets/soda-14ff8a788d/cherry.glb" exposure="1.2"></model-viewer>
                <model-viewer class="berry b5" src="https://api.getlayers.ai/storage/v1/object/public/public/assets/soda-14ff8a788d/cherry.glb" exposure="1.2"></model-viewer>
                <model-viewer class="berry b6" src="https://api.getlayers.ai/storage/v1/object/public/public/assets/soda-14ff8a788d/cherry.glb" exposure="1.2"></model-viewer>
            </div>

            <div class="hero-right">
                <div class="product-carousel">
                    <div class="carousel-cards">
                        <div class="card active" data-flavor="classic">
                            <img src="https://api.getlayers.ai/storage/v1/object/public/public/assets/soda-14ff8a788d/Green%20Soda.png" alt="Diet Classic">
                            <div class="card-info"><span>Diet Classic</span><span>$2.99</span></div>
                        </div>
                        <div class="card" data-flavor="blue">
                            <img src="https://api.getlayers.ai/storage/v1/object/public/public/assets/soda-14ff8a788d/Blue%20Soda.png" alt="Zero Lime" style="filter: brightness(0.7);">
                            <div class="card-info"><span>Zero Lime</span><span>$2.99</span></div>
                        </div>
                    </div>
                    <div class="carousel-nav">
                        <button class="nav-arrow">←</button>
                        <button class="nav-arrow">→</button>
                    </div>
                </div>
                <h2 class="side-title"><span class="outline">Refreshingly</span><br>Clean</h2>
            </div>
        </div>
    </main>

    <div style="display: none;">
        <model-viewer src="https://api.getlayers.ai/storage/v1/object/public/public/assets/soda-14ff8a788d/blueberry.glb"></model-viewer>
        <model-viewer src="https://api.getlayers.ai/storage/v1/object/public/public/assets/soda-14ff8a788d/cherry.glb"></model-viewer>
    </div>

    <script>
        const modelViewer = document.querySelector('#product-model');
        const berriesFG = document.querySelector('.berries-container');
        const berriesBG = document.querySelector('.berries-container-bg');
        const leavesBG = document.querySelector('.leaves-container');
        const allBerries = document.querySelectorAll('.berry');
        const cards = document.querySelectorAll('.card');
        let isSwitching = false;
        let switchSpin = 0;
        let blueTexture = null;
        let greenTexture = null;

        const berryPositions = [
            { top: '25%', left: '30%', w: 220, h: 220 },
            { top: '60%', left: '42%', w: 100, h: 100 },
            { top: '30%', left: '62%', w: 250, h: 250 },
            { top: '15%', left: '48%', w: 140, h: 140 },
            { top: '75%', left: '20%', w: 120, h: 120 },
            { top: '45%', left: '75%', w: 180, h: 180 },
            { top: '15%', left: '40%', w: 80, h: 80 },
            { top: '50%', left: '55%', w: 70, h: 70 },
            { top: '80%', left: '35%', w: 75, h: 75 }
        ];

        allBerries.forEach((b, i) => {
            const pos = berryPositions[i];
            b.style.top = pos.top;
            b.style.left = pos.left;
            b.style.width = pos.w + 'px';
            b.style.height = pos.h + 'px';
            b.dataset.rx = 0; b.dataset.ry = 0; b.dataset.angle = Math.random() * 360;
            b.dataset.baseX = 0; b.dataset.baseY = 0;
        });

        modelViewer.addEventListener('load', async () => {
            blueTexture = await modelViewer.createTexture('https://api.getlayers.ai/storage/v1/object/public/public/assets/soda-14ff8a788d/blue%20base%20color.jpg');
            greenTexture = await modelViewer.createTexture('https://api.getlayers.ai/storage/v1/object/public/public/assets/soda-14ff8a788d/green%20base%20color.jpg');
        });

        cards.forEach(card => {
            card.addEventListener('click', () => {
                if (isSwitching) return;
                cards.forEach(c => c.classList.remove('active'));
                card.classList.add('active');
                switchFlavor(card.dataset.flavor);
            });
        });

        function switchFlavor(flavor) {
            if (isSwitching) return;
            isSwitching = true;
            const body = document.body;
            const targetColors = flavor === 'blue' ? 
                { inner: '#0b4f8a', mid: '#04294e', outer: '#010c14' } : 
                { inner: '#0b8a78', mid: '#044e3b', outer: '#011411' };

            gsap.to(body, { '--bg-inner': targetColors.inner, '--bg-mid': targetColors.mid, '--bg-outer': targetColors.outer, duration: 1.5 });

            const spinObj = { val: 0, blur: 0 };
            gsap.to(spinObj, {
                val: 360, blur: 15, duration: 0.6, ease: 'power2.in',
                onUpdate: () => { switchSpin = spinObj.val; modelViewer.style.filter = `blur(${spinObj.blur}px)`; },
                onComplete: () => {
                    const mat = modelViewer.model.materials[0];
                    mat.pbrMetallicRoughness.baseColorTexture.setTexture(flavor === 'blue' ? blueTexture : greenTexture);
                    flavor === 'blue' ? body.classList.add('blue-theme') : body.classList.remove('blue-theme');
                    gsap.to(spinObj, {
                        val: 720, blur: 0, duration: 1.5, ease: 'back.out(0.7)',
                        onUpdate: () => { switchSpin = spinObj.val; modelViewer.style.filter = `blur(${spinObj.blur}px)`; },
                        onComplete: () => { switchSpin = 0; modelViewer.style.filter = 'none'; }
                    });
                }
            });

            let completed = 0;
            allBerries.forEach(berry => {
                const rect = berry.getBoundingClientRect();
                const cX = window.innerWidth / 2 - rect.left - rect.width / 2;
                const cY = window.innerHeight / 2 - rect.top - rect.height / 2;
                const nextX = (Math.random() - 0.5) * 200, nextY = (Math.random() - 0.5) * 200;

                gsap.timeline()
                    .to(berry, { x: cX, y: cY, scale: 0.1, opacity: 0, duration: 0.5, ease: 'power2.in' })
                    .set(berry, { src: flavor === 'blue' ? 'https://api.getlayers.ai/storage/v1/object/public/public/assets/soda-14ff8a788d/blueberry.glb' : 'https://api.getlayers.ai/storage/v1/object/public/public/assets/soda-14ff8a788d/cherry.glb' })
                    .to(berry, { x: nextX, y: nextY, scale: 1, opacity: 1, duration: 0.9, delay: 0.3, ease: 'back.out(1.5)', 
                        onComplete: () => { 
                            berry.dataset.baseX = nextX; berry.dataset.baseY = nextY; berry.dataset.rx = 0; berry.dataset.ry = 0; 
                            completed++; if (completed === allBerries.length) isSwitching = false; 
                        } 
                    });
            });
        }

        let mouse = { x: 0, y: 0, px: 0, py: 0 }, currentMouse = { x: 0, y: 0 };
        window.addEventListener('mousemove', e => {
            mouse.x = (e.clientX / window.innerWidth) - 0.5;
            mouse.y = (e.clientY / window.innerHeight) - 0.5;
            mouse.px = e.clientX; mouse.py = e.clientY;
        });

        function animate() {
            const time = Date.now() * 0.001;
            currentMouse.x += (mouse.x - currentMouse.x) * 0.05;
            currentMouse.y += (mouse.y - currentMouse.y) * 0.05;
            modelViewer.cameraOrbit = `${(currentMouse.x * 40) + switchSpin}deg ${90 + (currentMouse.y * 20)}deg 380%`;
            berriesFG.style.transform = `translate(${currentMouse.x * 60}px, ${currentMouse.y * 60}px)`;
            berriesBG.style.transform = `translate(${currentMouse.x * -30}px, ${currentMouse.y * -30}px)`;
            leavesBG.style.transform = `translate(${currentMouse.x * -15}px, ${currentMouse.y * -15}px)`;

            if (!isSwitching) {
                allBerries.forEach((berry, i) => {
                    const rect = berry.getBoundingClientRect();
                    const bX = rect.left + rect.width / 2, bY = rect.top + rect.height / 2;
                    const dX = mouse.px - bX, dY = mouse.py - bY, dist = Math.sqrt(dX * dX + dY * dY);
                    let tRx = 0, tRy = 0, sMult = 1;
                    if (dist < 400) { const f = (400 - dist) / 400; tRx = (dX / dist) * f * -80; tRy = (dY / dist) * f * -80; sMult = 1 + f * 5; }
                    let rx = parseFloat(berry.dataset.rx), ry = parseFloat(berry.dataset.ry), a = parseFloat(berry.dataset.angle);
                    rx += (tRx - rx) * 0.1; ry += (tRy - ry) * 0.1; a += 0.2 * sMult;
                    berry.dataset.rx = rx; berry.dataset.ry = ry; berry.dataset.angle = a;
                    const dur = [5, 7, 6, 8, 5.5, 6.5, 9, 11, 10][i % 9], ph = (time + i * 0.7) * (Math.PI * 2 / dur);
                    berry.style.transform = `translate(calc(${rx + parseFloat(berry.dataset.baseX)}px), calc(${ry + parseFloat(berry.dataset.baseY)}px + ${Math.sin(ph) * 15}px)) rotate(calc(${a}deg + ${Math.cos(ph) * 6}deg))`;
                });
            }
            requestAnimationFrame(animate);
        }
        animate();

        setInterval(() => {
            const b = document.createElement('img');
            b.src = 'https://api.getlayers.ai/storage/v1/object/public/public/assets/soda-14ff8a788d/bubble.png';
            b.className = 'bubble-img';
            const s = Math.random() * 20 + 10 + 'px';
            b.style.width = s; b.style.left = Math.random() * 100 + '%';
            b.style.bottom = '-50px'; b.style.opacity = Math.random() * 0.4 + 0.2;
            const d = Math.random() * 6 + 4; b.style.animation = `floatUpImg ${d}s linear forwards`;
            document.getElementById('bubbles-container').appendChild(b);
            setTimeout(() => b.remove(), d * 1000);
        }, 400);
    </script>
</body>
</html>
